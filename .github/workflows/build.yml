name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: lr13-btn-mod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  # ---- macOS: Apple Silicon (arm64) ----
  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        run: |
          cp "target/aarch64-apple-darwin/release/$BIN" "$BIN"
          tar czf "$BIN-macos-arm64.tar.gz" "$BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-macos-arm64
          path: ${{ env.BIN }}-macos-arm64.tar.gz
          if-no-files-found: error

  # ---- Linux: static x86_64 (musl) ----
  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          cp "target/x86_64-unknown-linux-musl/release/$BIN" "$BIN"
          tar czf "$BIN-linux-x86_64.tar.gz" "$BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-linux-x86_64
          path: ${{ env.BIN }}-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---- Windows: x86_64 (MSVC) ----
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: bash
        run: |
          cp "target/x86_64-pc-windows-msvc/release/$BIN.exe" "$BIN.exe"
          7z a "$BIN-windows-x86_64.zip" "$BIN.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-windows-x86_64
          path: ${{ env.BIN }}-windows-x86_64.zip
          if-no-files-found: error

  # ---- Attach all artifacts to a GitHub Release on tags ----
  release:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
